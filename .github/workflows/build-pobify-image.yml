name: Pobify n8n image

on:
  push:
    branches: [pobify]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pobify-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'pobify' || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build test configuration
        run: pnpm turbo run build --filter=@n8n/vitest-config --filter=@n8n/frontend-vite-config
      - name: Run Pobify tests
        run: |
          pnpm --filter n8n-editor-ui test src/app/components/app/ResourceUsageOverlay.test.ts src/features/ndv/parameters/components/ResourceLocator/ResourceLocatorDropdown.test.ts --maxWorkers=1
          pnpm --filter @n8n/n8n-nodes-langchain test nodes/vendors/Ollama/methods/listSearch.test.ts --maxWorkers=1
      - name: Build n8n image
        run: pnpm build:docker
      - name: Smoke test image
        run: pnpm build:docker:smoke
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        run: |
          build_sha="$(git rev-parse HEAD)"
          pobify_sha="$(git ls-remote origin refs/heads/pobify | cut -f1)"
          if [ "$build_sha" != "$pobify_sha" ]; then
            echo "A newer pobify commit exists. Skip stale image publication."
            exit 0
          fi
          docker tag n8nio/n8n:local ghcr.io/poghybibolabs/n8n:pobify
          docker tag n8nio/n8n:local "ghcr.io/poghybibolabs/n8n:pobify-${build_sha}"
          docker push ghcr.io/poghybibolabs/n8n:pobify
          docker push "ghcr.io/poghybibolabs/n8n:pobify-${build_sha}"
